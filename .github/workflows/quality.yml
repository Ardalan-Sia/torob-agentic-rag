name: Quality checks

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: phase2/requirements.txt
      - name: Install agent dependencies
        run: python -m pip install -r phase2/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q phase1/torob_rag/src phase2/src phase2/tests
      - name: Run artifact-independent tests
        run: python -m unittest discover -s phase2/tests -p 'test_*.py'
